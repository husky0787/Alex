AWSTemplateFormatVersion: '2010-09-09'
Description: Disposable Alex CD acceptance. No existing application resources.
Parameters:
  RunnerCidr:
    Type: String
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/32'
  ClusterRole:
    Type: String
  NodeRole:
    Type: String
  ReleaseRole:
    Type: String
  ZoneA:
    Type: String
  ZoneB:
    Type: String
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.192.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
  Gateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref Gateway
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.192.0.0/24
      AvailabilityZone: !Ref ZoneA
      MapPublicIpOnLaunch: true
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.192.1.0/24
      AvailabilityZone: !Ref ZoneB
      MapPublicIpOnLaunch: true
  Routes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref Routes
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Gateway
  AssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref Routes
      SubnetId: !Ref SubnetA
  AssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref Routes
      SubnetId: !Ref SubnetB
  Cluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: alex-cd-window
      Version: '1.35'
      RoleArn: !Ref ClusterRole
      UpgradePolicy:
        SupportType: STANDARD
      AccessConfig:
        AuthenticationMode: API
        BootstrapClusterCreatorAdminPermissions: false
      ResourcesVpcConfig:
        SubnetIds: [!Ref SubnetA, !Ref SubnetB]
        EndpointPrivateAccess: true
        EndpointPublicAccess: true
        PublicAccessCidrs: [!Ref RunnerCidr]
  Access:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref Cluster
      PrincipalArn: !Ref ReleaseRole
      Type: STANDARD
      AccessPolicies:
        - PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
          AccessScope:
            Type: cluster
  Nodes:
    Type: AWS::EKS::Nodegroup
    DependsOn: [DefaultRoute, AssociationA, AssociationB]
    Properties:
      ClusterName: !Ref Cluster
      NodegroupName: acceptance
      NodeRole: !Ref NodeRole
      Subnets: [!Ref SubnetA, !Ref SubnetB]
      AmiType: AL2023_x86_64_STANDARD
      CapacityType: ON_DEMAND
      InstanceTypes: [t3.medium]
      DiskSize: 20
      ScalingConfig:
        MinSize: 2
        MaxSize: 2
        DesiredSize: 2
Outputs:
  ClusterName:
    Value: !Ref Cluster
  VpcId:
    Value: !Ref Vpc
