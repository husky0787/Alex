[project]
name = "alex-research"
version = "0.1.0"
description = "Traceable research ingestion and retrieval for Alex"
requires-python = ">=3.12"
dependencies = ["boto3>=1.40.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research_chain"]
