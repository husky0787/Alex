[project]
name = "alex-market-data"
version = "0.1.0"
description = "Traceable daily market data for Alex"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40,<2",
    "exchange-calendars>=4.11,<5",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["market_data"]
