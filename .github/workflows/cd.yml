name: Release to temporary EKS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alex-eks-cd-lifecycle
  cancel-in-progress: false

jobs:
  gate:
    if: github.ref == 'refs/heads/main' && github.repository == 'husky0787/Alex'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.ci.outputs.run_id }}
      artifact_id: ${{ steps.ci.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.12'
      - id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project deploy/cd/gate.py

  deploy:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: alex-eks-cd
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      ALEX_CD_ROLE_ARN: ${{ vars.ALEX_CD_ROLE_ARN }}
      ALEX_CD_CF_ROLE_ARN: ${{ vars.ALEX_CD_CF_ROLE_ARN }}
      ALEX_CD_CLUSTER_ROLE: ${{ vars.ALEX_CD_CLUSTER_ROLE }}
      ALEX_CD_NODE_ROLE: ${{ vars.ALEX_CD_NODE_ROLE }}
      ALEX_CD_REPOSITORY: ${{ vars.ALEX_CD_REPOSITORY }}
      RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      SOURCE_CI_RUN: ${{ needs.gate.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.12'
      - name: Check budget window before cloud operations
        env:
          APPROVED_UNTIL: ${{ vars.ALEX_CD_APPROVED_UNTIL }}
          RECOVERY_ENABLED: ${{ vars.ALEX_CD_RECOVERY_ENABLED }}
        run: uv run --no-project deploy/cd/window.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.gate.outputs.artifact_id }}
          run-id: ${{ needs.gate.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .local/ci/artifacts
          merge-multiple: true
      - run: uv run --no-project deploy/cd/install_tools.py
      - name: Verify archive hashes and source labels before provisioning
        run: uv run --no-project deploy/cd/acceptance.py --verify-only
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.ALEX_CD_ROLE_ARN }}
          role-session-name: cd-${{ github.run_id }}
          role-duration-seconds: 7200
          aws-region: us-east-1
          allowed-account-ids: ${{ vars.ALEX_AWS_ACCOUNT_ID }}
      - name: Create temporary EKS
        run: uv run --no-project deploy/cd/lifecycle.py create --release-id "$RELEASE_ID"
      - name: Release tested images and verify rollback
        run: uv run --no-project deploy/cd/acceptance.py
      - name: Save safe acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eks-cd-acceptance
          path: .local/cd/evidence/*.json
          include-hidden-files: true
          retention-days: 14

  cleanup:
    needs: [gate, deploy]
    if: always() && needs.gate.result == 'success' && needs.deploy.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: alex-eks-cd
    permissions:
      contents: read
      id-token: write
    env:
      ALEX_CD_CF_ROLE_ARN: ${{ vars.ALEX_CD_CF_ROLE_ARN }}
      ALEX_CD_REPOSITORY: ${{ vars.ALEX_CD_REPOSITORY }}
      RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.ALEX_CD_ROLE_ARN }}
          role-session-name: cd-cleanup-${{ github.run_id }}
          role-duration-seconds: 7200
          aws-region: us-east-1
          allowed-account-ids: ${{ vars.ALEX_AWS_ACCOUNT_ID }}
      - run: uv run --no-project deploy/cd/lifecycle.py cleanup --release-id "$RELEASE_ID"
      - name: Save cleanup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eks-cd-cleanup
          path: .local/cd/evidence/*.json
          include-hidden-files: true
          retention-days: 14
